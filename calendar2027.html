<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 마음을 나누는 사람들 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────
   2027 마음을 나누는 사람들 재단 — 캘린더 & 다이어리
   A4 가로(297×210mm). A3로 확대 인쇄해도 비율이 같습니다.
   앞면: 월간 달력(날짜 메모) + 주간 할 일 + 월간 할 일 + 메모
   뒷면: 이달의 좋은 글귀 + 4대 사업 + 이달을 돌아보며
   ─────────────────────────────────────────────── */
@page { size: 297mm 210mm; margin: 0; }
:root {
  --ink: #2c2f3f;
  --muted: #8b8e9c;
  --faint: #c9c7c1;
  --line: #e4e1da;
  --paper: #fffdf9;
  --sun: #d6453f;
  --sat: #3769ad;
  --brand: #136f5f;       /* 재단 포스터의 초록 */
  --brand-dark: #17302c;
  --ac: #4a78a8;
}
/* 월별 색(--ac)이 바뀌는 곳마다 파생 색을 다시 계산 */
:root, .page, .ym {
  --ac-soft: color-mix(in srgb, var(--ac) 10%, white);
  --ac-mid: color-mix(in srgb, var(--ac) 28%, white);
  --ac-deep: color-mix(in srgb, var(--ac) 80%, black);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #e9e6e0; }
body {
  font-family: "Noto Sans KR", "WenQuanYi Zen Hei", sans-serif;
  color: var(--ink);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.sheet-label {
  width: 297mm; margin: 10mm auto 2mm; font-size: 12px; color: #6d6a64;
  letter-spacing: .04em;
}
.page {
  width: 297mm; height: 210mm; margin: 0 auto 6mm;
  background: var(--paper); position: relative; overflow: hidden;
  box-shadow: 0 2px 14px rgba(0,0,0,.12);
  padding: 9mm 10mm 8mm;
}
@media print {
  html, body { background: none; }
  .sheet-label { display: none; }
  .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
}
@media screen and (max-width: 1150px) {
  body { zoom: .5; }
}
/* 벽걸이 구멍 표시 (상단 가운데) */
.hole { position: absolute; top: 3.2mm; left: 50%; width: 5mm; height: 5mm; margin-left: -2.5mm;
  border-radius: 50%; border: .3mm solid var(--faint); }

/* ── 공통 ── */
.brand { display: flex; align-items: center; gap: 2mm; font-weight: 700; font-size: 9pt; letter-spacing: -.01em; color: var(--brand-dark); }
.brand img { height: 8mm; width: auto; }
.brand span { display: flex; flex-direction: column; line-height: 1.15; }
.brand small { font-size: 5.6pt; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.box-title { font-size: 8.5pt; font-weight: 700; color: var(--ac-deep); display: flex; align-items: baseline; gap: 1.6mm; margin-bottom: 1.6mm; }
.box-title small { font-size: 6.5pt; font-weight: 500; color: var(--muted); letter-spacing: .08em; }
.ruled { display: flex; flex-direction: column; }
.ruled > i { flex: 1; border-bottom: .2mm dotted #cfccc4; display: block; }
.check { display: flex; flex-direction: column; }
.check > i { flex: 1; display: flex; align-items: flex-end; gap: 1.6mm; border-bottom: .2mm dotted #cfccc4; padding-bottom: .9mm; }
.check > i::before { content: ""; width: 2.6mm; height: 2.6mm; border: .25mm solid var(--ac); border-radius: .6mm; flex: none; background: #fff; }

/* ── 앞면 ── */
.front { display: grid; grid-template-columns: 1fr 64mm; gap: 6mm; height: 100%; }
.f-left { display: flex; flex-direction: column; min-height: 0; }
.f-head { display: flex; align-items: flex-end; gap: 4mm; margin-bottom: 3.5mm; }
.mnum { font-size: 46pt; font-weight: 900; line-height: .82; color: var(--ac); letter-spacing: -.04em; }
.mname { padding-bottom: .6mm; }
.mname b { display: block; font-size: 15pt; font-weight: 700; line-height: 1.1; }
.mname span { font-size: 7.5pt; letter-spacing: .32em; color: var(--muted); font-weight: 500; }
.f-head .focus { margin-left: auto; text-align: right; font-size: 7pt; color: var(--muted); padding-bottom: .6mm; line-height: 1.45; }
.f-head .focus b { color: var(--ac-deep); font-weight: 700; font-size: 8pt; }
.cal { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr) 37mm; border-top: .5mm solid var(--ink); min-height: 0; }
.cal .dh { font-size: 7.5pt; font-weight: 700; text-align: center; padding: 1.4mm 0 1.2mm; border-bottom: .3mm solid var(--ink); }
.cal .dh.sun { color: var(--sun); } .cal .dh.sat { color: var(--sat); }
.cal .dh.wk { background: var(--ac); color: #fff; border-bottom-color: var(--ac); }
.cell { border-bottom: .25mm solid var(--line); border-right: .25mm solid var(--line); padding: 1.2mm 1.4mm 1mm; display: flex; flex-direction: column; min-height: 0; position: relative; }
.cell:nth-child(8n+1) { border-left: .25mm solid var(--line); }
.cell .d { display: flex; align-items: baseline; gap: 1.2mm; height: 5mm; flex: none; }
.cell .d b { font-size: 11pt; font-weight: 700; line-height: 1; }
.cell .d em { font-style: normal; font-size: 5.6pt; font-weight: 500; color: var(--sun); line-height: 1.15; letter-spacing: -.03em; }
.cell .d em.ann { color: var(--muted); }
.cell.sun .d b, .cell.hol .d b { color: var(--sun); }
.cell.sat:not(.hol) .d b { color: var(--sat); }
.cell .ruled { flex: 1; }
.cell.out { background: repeating-linear-gradient(135deg, transparent 0 2mm, #f3f0ea 2mm 2.4mm); }
.cell.out .d b { color: var(--faint); font-weight: 400; }
.cell.today-mark .d b { }
.wkcell { background: var(--ac-soft); border-bottom: .25mm solid var(--ac-mid); padding: 1.2mm 2mm 1mm; display: flex; flex-direction: column; min-height: 0; }
.wkcell .wl { font-size: 6pt; color: var(--ac-deep); font-weight: 700; height: 5mm; display: flex; align-items: baseline; gap: 1.4mm; flex: none; }
.wkcell .wl span { font-weight: 400; color: var(--muted); }
.wkcell .check { flex: 1; }
.wkcell .check > i { border-bottom-color: var(--ac-mid); }

.f-right { display: flex; flex-direction: column; gap: 3.2mm; min-height: 0; }
.f-right .brand { justify-content: flex-end; height: 9mm; align-items: flex-end; padding-bottom: .4mm; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; padding: 2.4mm 2.4mm 2mm; border-radius: 2mm; background: #f5f2ec; }
.mini .mt { font-size: 6.5pt; font-weight: 700; margin-bottom: .8mm; }
.mini .mt span { color: var(--muted); font-weight: 400; }
.mini .mg { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 5pt; text-align: center; row-gap: .3mm; }
.mini .mg .s { color: var(--sun); } .mini .mg .t { color: var(--sat); }
.mini .mg .h { color: var(--muted); font-weight: 700; }
.goal { border: .35mm solid var(--ac); border-radius: 2mm; padding: 2mm 2.6mm 1.6mm; height: 22mm; display: flex; flex-direction: column; }
.goal .ruled { flex: 1; }
.todo { height: 52mm; display: flex; flex-direction: column; }
.todo .check { flex: 1; }
.memo { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.memo .ruled { flex: 1; }
.foot { font-size: 6pt; color: var(--muted); text-align: right; line-height: 1.5; }
.foot b { color: var(--brand); font-weight: 700; }

/* ── 뒷면 ── */
.back { display: grid; grid-template-rows: 1fr 76mm; gap: 6mm; height: 100%; }
.quote {
  position: relative; border-radius: 4mm; overflow: hidden; padding: 11mm 16mm 10mm 16mm;
  background: linear-gradient(135deg, var(--ac-soft) 0%, color-mix(in srgb, var(--ac) 22%, white) 100%);
  display: flex; flex-direction: column; justify-content: center;
}
.quote .bg { position: absolute; inset: 0; pointer-events: none; }
.quote .tag { position: absolute; top: 7mm; left: 16mm; font-size: 7.5pt; letter-spacing: .28em; color: var(--ac-deep); font-weight: 700; }
.quote .mark { font-family: "Gowun Batang", serif; font-size: 70pt; line-height: .6; color: var(--ac); opacity: .5; height: 12mm; }
.quote blockquote { font-family: "Gowun Batang", serif; font-size: 21pt; line-height: 1.6; font-weight: 700; color: var(--ink); max-width: 200mm; position: relative; word-break: keep-all; }
.quote cite { display: block; margin-top: 5mm; font-style: normal; font-size: 9.5pt; color: var(--ac-deep); font-weight: 500; position: relative; }
.quote cite::before { content: ""; display: inline-block; width: 8mm; height: .35mm; background: var(--ac); vertical-align: middle; margin-right: 2.5mm; }
.quote .bigm { position: absolute; right: 12mm; bottom: 4mm; font-size: 110pt; font-weight: 900; color: #fff; opacity: .55; line-height: 1; letter-spacing: -.05em; }
.quote .qbrand { position: absolute; top: 6mm; right: 12mm; }
.quote .wm { position: absolute; right: 52mm; top: 50%; height: 74%; transform: translateY(-50%); opacity: .08; mix-blend-mode: multiply; }

.b-bottom { display: grid; grid-template-columns: 1fr 78mm; gap: 6mm; min-height: 0; }
.biz { display: flex; flex-direction: column; min-height: 0; }
.biz-head { display: flex; align-items: baseline; gap: 2.5mm; margin-bottom: 2.6mm; }
.biz-head b { font-size: 11pt; font-weight: 900; }
.biz-head span { font-size: 7pt; color: var(--muted); }
.cards { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; min-height: 0; }
.card { border: .3mm solid var(--line); border-radius: 3mm; display: flex; flex-direction: column; background: #fff; position: relative; overflow: hidden; }
.card .ph { height: 19mm; background-size: cover; background-position: center; position: relative; flex: none; }
.card .ph::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.5)); }
.card .ph .no { position: absolute; left: 2.4mm; bottom: 1.8mm; font-size: 6pt; font-weight: 900; color: #fff; letter-spacing: .12em; text-shadow: 0 0 2mm rgba(0,0,0,.45); z-index: 1; }
.card .cb { padding: 2.4mm 3mm 2.4mm; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.card .sub { font-size: 6pt; font-weight: 700; color: var(--brand); }
.card h4 { font-size: 10.5pt; font-weight: 900; margin: .4mm 0 1.2mm; letter-spacing: -.03em; }
.card p { font-size: 6.3pt; line-height: 1.55; color: #55586a; word-break: keep-all; }
.card .kw { display: flex; flex-wrap: wrap; gap: .8mm; margin-top: 1.6mm; }
.card .kw span { font-size: 5.3pt; padding: .3mm 1.4mm; border-radius: 3mm; background: #eef4f1; color: var(--brand); font-weight: 500; }
.card .act { margin-top: auto; display: flex; flex-direction: column; height: 9mm; }
.card .act > span { font-size: 5.5pt; font-weight: 700; color: var(--muted); }
.card .act .ruled { flex: 1; }
.card.on { border-color: var(--ac); box-shadow: 0 0 0 .5mm var(--ac); }
.card.on .cb { background: var(--ac-soft); }
.card .badge { position: absolute; top: 2mm; right: 2mm; font-size: 5.6pt; font-weight: 700; background: var(--ac); color: #fff; border-radius: 5mm; padding: .5mm 1.8mm; }
.reflect { border-radius: 3mm; background: #f5f2ec; padding: 3.2mm 4mm 3mm; display: flex; flex-direction: column; min-height: 0; }
.reflect .rq { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 1.4mm; }
.reflect .rq > span { font-size: 6.8pt; font-weight: 700; color: var(--ac-deep); }
.reflect .rq > span::before { content: "♥ "; color: var(--ac); }
.reflect .ruled { flex: 1; }

/* ── 표지 ── */
.cover { padding: 0; background: #f6f8f3; }
.cover .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .logo { position: absolute; left: 20mm; top: 18mm; width: 74mm; }
.cover .ct { position: absolute; left: 20mm; top: 98mm; }
.cover .yr { font-size: 78pt; font-weight: 900; letter-spacing: -.05em; line-height: .9; color: var(--brand-dark); }
.cover .yr span { color: var(--brand); }
.cover .hand { font-family: "Nanum Pen Script", cursive; font-size: 30pt; color: var(--brand); margin-top: 3mm; transform: rotate(-3deg); transform-origin: left; }
.cover .sub { margin-top: 5mm; font-size: 8pt; letter-spacing: .3em; color: #7f8a86; }
.cover .photos { position: absolute; right: 16mm; top: 18mm; width: 150mm; height: 150mm; }
.cover .pol { position: absolute; width: 66mm; background: #fff; padding: 2.4mm 2.4mm 0; box-shadow: 0 1.2mm 4mm rgba(30,50,45,.18); }
.cover .pol div { height: 50mm; background-size: cover; background-position: center; }
.cover .pol p { font-size: 8pt; font-weight: 700; padding: 2mm .5mm 2.4mm; color: var(--brand-dark); display: flex; justify-content: space-between; align-items: baseline; }
.cover .pol p span { font-size: 6pt; font-weight: 500; color: var(--brand); }
.cover .pol::before { content: ""; position: absolute; top: -2.5mm; left: 50%; width: 16mm; height: 5mm; margin-left: -8mm; background: rgba(235,228,205,.85); transform: rotate(-3deg); }
.cover .info { position: absolute; left: 20mm; bottom: 12mm; font-size: 7.5pt; color: #4f5b57; line-height: 1.6; }
.cover .info b { color: var(--brand); }
/* ── 연간 ── */
.year { display: grid; grid-template-columns: 1fr 70mm; gap: 7mm; height: 100%; }
.y-left { display: flex; flex-direction: column; }
.y-head { display: flex; align-items: flex-end; gap: 4mm; margin-bottom: 5mm; }
.y-head b { font-size: 32pt; font-weight: 900; line-height: .85; letter-spacing: -.04em; color: var(--brand); }
.y-head span { font-size: 11pt; font-weight: 700; padding-bottom: .5mm; }
.ygrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4mm 6mm; }
.ym .mt { font-size: 9pt; font-weight: 900; margin-bottom: 1.4mm; color: var(--ac); border-bottom: .3mm solid var(--ac); padding-bottom: .8mm; display: flex; justify-content: space-between; align-items: baseline; }
.ym .mt span { font-size: 5.5pt; color: var(--muted); font-weight: 500; letter-spacing: .15em; }
.ym .mg { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 8pt; text-align: center; row-gap: 1.7mm; }
.ym .mg .s { color: var(--sun); } .ym .mg .t { color: var(--sat); }
.ym .mg .h { color: var(--muted); font-weight: 700; font-size: 6.2pt; }
.ym .mg .hol { color: var(--sun); font-weight: 700; }
.y-right { display: flex; flex-direction: column; gap: 5mm; }
.y-right .brand { justify-content: flex-end; }
.y-box { border-radius: 3mm; padding: 3.5mm 4mm 3mm; display: flex; flex-direction: column; }
.y-box.g { border: .35mm solid var(--brand); flex: 1.1; }
.y-box.d { background: #f5f2ec; flex: 1; }
.y-box .ruled, .y-box .check { flex: 1; }
.y-box .box-title { color: var(--brand); }
</style>
</head>

<script>

  "2-6": "설 연휴", "2-7": "설날", "2-8": "설 연휴", "2-9": "대체공휴일",
  "3-1": "삼일절", "5-5": "어린이날", "5-13": "부처님오신날", "6-6": "현충일",
  "8-15": "광복절", "8-16": "대체공휴일",
  "9-14": "추석 연휴", "9-15": "추석", "9-16": "추석 연휴",
  "10-3": "개천절", "10-4": "대체공휴일", "10-9": "한글날", "10-11": "대체공휴일",
  "12-25": "성탄절", "12-27": "대체공휴일",
};
// 기념일 (회색, 쉬는 날 아님)
const ANNIV = { "4-5": "식목일", "5-8": "어버이날", "5-15": "스승의 날", "7-17": "제헌절", "11-11": "농업인의 날" };

const ACCENTS = ["#4a78a8","#c4597d","#d9825a","#d96f86","#5a9a6a","#3a9496",
                 "#2f86b0","#d6952e","#c07a35","#b4573a","#86684f","#2f6b56"];
const EN = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
/* ═══════════════════════════════════════════════════════ */

const brand = () => `<div class="brand"><img src="${ASSET}logo-mark.png" alt=""><span><small>재단법인</small>${FOUNDATION}</span></div>`;
const lines = (n) => `<div class="ruled">${"<i></i>".repeat(n)}</div>`;
const checks = (n) => `<div class="check">${"<i></i>".repeat(n)}</div>`;

const daysIn = (m) => new Date(YEAR, m, 0).getDate();           // m: 1~12
const firstDow = (m) => new Date(YEAR, m - 1, 1).getDay();
const weeksIn = (m) => Math.ceil((firstDow(m) + daysIn(m)) / 7);
const DOW = ["일","월","화","수","목","금","토"];

function miniGrid(y, m, opts = {}) {
  const d0 = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate();
  let h = DOW.map((d) => `<div class="h">${d}</div>`).join("");
  for (let i = 0; i < d0; i++) h += "<div></div>";
  for (let d = 1; d <= n; d++) {
    const w = (d0 + d - 1) % 7;
    const hol = opts.holidays && y === YEAR && HOLIDAYS[`${m}-${d}`];
    h += `<div class="${hol ? "hol" : w === 0 ? "s" : w === 6 ? "t" : ""}">${d}</div>`;
  }
  return `<div class="mg">${h}</div>`;
}
function mini(y, m) {
  return `<div class="mini"><div class="mt">${m}월 <span>${y}</span></div>${miniGrid(y, m)}</div>`;
}
const quarterOf = (m) => Math.ceil(m / 3);
const focusProject = (m) => PROJECTS.find((p) => p.quarter === quarterOf(m));

function front(m) {
  const d0 = firstDow(m), n = daysIn(m), W = weeksIn(m);
  let cells = DOW.map((d, i) => `<div class="dh ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("")
            + `<div class="dh wk">이번 주 할 일</div>`;
  const lineCount = W === 6 ? 3 : 4;
  for (let w = 0; w < W; w++) {
    let first = null, last = null;
    for (let i = 0; i < 7; i++) {
      const d = w * 7 + i - d0 + 1;
      if (d < 1 || d > n) { cells += `<div class="cell out"><div class="d"></div></div>`; continue; }
      first ??= d; last = d;
      const key = `${m}-${d}`, hol = HOLIDAYS[key], ann = ANNIV[key];
      const cls = ["cell", i === 0 ? "sun" : i === 6 ? "sat" : "", hol ? "hol" : ""].join(" ");
      const label = hol ? `<em>${hol}</em>` : ann ? `<em class="ann">${ann}</em>` : "";
      cells += `<div class="${cls}"><div class="d"><b>${d}</b>${label}</div>${lines(lineCount)}</div>`;
    }
    cells += `<div class="wkcell"><div class="wl">${w + 1}주차 <span>${first === last ? `${m}.${first}` : `${m}.${first} – ${m}.${last}`}</span></div>${checks(W === 6 ? 3 : 4)}</div>`;
  }
  const prev = m === 1 ? [YEAR - 1, 12] : [YEAR, m - 1];
  const next = m === 12 ? [YEAR + 1, 1] : [YEAR, m + 1];
  const fp = focusProject(m);
  return `
  <section class="page" style="--ac:${ACCENTS[m - 1]}">
    <div class="hole"></div>
    <div class="front">
      <div class="f-left">
        <div class="f-head">
          <div class="mnum">${String(m).padStart(2, "0")}</div>
          <div class="mname"><b>${m}월</b><span>${EN[m - 1]} ${YEAR}</span></div>
          <div class="focus">${quarterOf(m)}분기 집중 사업 · ${fp.sub}<br><b>${fp.title}</b></div>
        </div>
        <div class="cal" style="grid-template-rows: auto repeat(${W}, 1fr)">${cells}</div>
      </div>
      <div class="f-right">
        ${brand()}
        <div class="minis">${mini(...prev)}${mini(...next)}</div>
        <div class="goal"><div class="box-title">이달의 목표 <small>GOAL</small></div>${lines(2)}</div>
        <div class="todo"><div class="box-title">월간 할 일 <small>TO DO</small></div>${checks(8)}</div>
        <div class="memo"><div class="box-title">메모 <small>MEMO</small></div>${lines(9)}</div>
        <div class="foot"><b>${CONTACT.account}</b><br>${CONTACT.mail}</div>
      </div>
    </div>
  </section>`;
}

function quoteArt() {
  // 은은한 원 + 재단 로고 바탕 무늬
  return `<svg class="bg" viewBox="0 0 277 110" preserveAspectRatio="xMidYMid slice">
    <circle cx="250" cy="10" r="46" fill="#fff" opacity=".35"/>
    <circle cx="20" cy="104" r="22" fill="#fff" opacity=".3"/>
  </svg><img class="wm" src="${ASSET}logo-mark.png" alt="">`;
}

function back(m) {
  const [q, who] = QUOTES[m - 1];
  const fp = focusProject(m);
  const cards = PROJECTS.map((p, i) => `
    <div class="card ${p === fp ? "on" : ""}">
      <div class="ph" style="background-image:url(${ASSET}${p.photo}); background-position:${p.pos}"><span class="no">0${i + 1} · ${p.en}</span></div>
      ${p === fp ? `<div class="badge">${quarterOf(m)}분기 집중</div>` : ""}
      <div class="cb">
        <div class="sub">${p.sub}</div>
        <h4>${p.title}</h4>
        <p>${p.desc}</p>
        <div class="kw">${p.kw.map((k) => `<span>${k}</span>`).join("")}</div>
        <div class="act"><span>이달의 참여 · 활동 기록</span>${lines(1)}</div>
      </div>
    </div>`).join("");
  return `
  <section class="page" style="--ac:${ACCENTS[m - 1]}">
    <div class="hole"></div>
    <div class="back">
      <div class="quote">
        ${quoteArt()}
        <div class="tag">${EN[m - 1]} · ${m}월의 좋은 글</div>
        <div class="qbrand">${brand()}</div>
        <div class="mark">“</div>
        <blockquote>${q}</blockquote>
        <cite>${who}</cite>
        <div class="bigm">${String(m).padStart(2, "0")}</div>
      </div>
      <div class="b-bottom">
        <div class="biz">
          <div class="biz-head"><b>${FOUNDATION} 4대 사업</b><span>PEOPLE SHARING HEARTS FOUNDATION</span></div>
          <div class="cards">${cards}</div>
        </div>
        <div class="reflect">
          <div class="box-title">이달을 돌아보며 <small>DIARY</small></div>
          <div class="rq"><span>감사했던 일</span>${lines(2)}</div>
          <div class="rq"><span>내가 나눈 마음</span>${lines(2)}</div>
          <div class="rq"><span>다음 달의 다짐</span>${lines(2)}</div>
        </div>
      </div>
    </div>
  </section>`;
}

function cover() {
  const tilt = [-4, 3, 2.5, -2.5], at = [[0, 2], [74, 0], [4, 76], [78, 74]];
  const pols = PROJECTS.map((p, i) => `
    <div class="pol" style="left:${at[i][0]}mm; top:${at[i][1]}mm; transform:rotate(${tilt[i]}deg)">
      <div style="background-image:url(${ASSET}${p.photo}); background-position:${p.pos}"></div>
      <p>${p.title}<span>${p.sub}</span></p>
    </div>`).join("");
  return `
  <section class="page cover">
    <div class="hole"></div>
    <svg class="art" viewBox="0 0 297 210" preserveAspectRatio="none">
      <path d="M0 182 C40 168 70 176 110 170 S190 160 230 172 S280 178 297 168 V210 H0z" fill="#dfe9df"/>
      <path d="M0 194 C50 184 90 192 140 186 S230 182 297 190 V210 H0z" fill="#cddfd2"/>
    </svg>
    <img class="logo" src="${ASSET}logo-full.png" alt="재단법인 마음을 나누는 사람들">
    <div class="ct">
      <div class="yr">20<span>27</span></div>
      <div class="hand">${SLOGAN} ♡</div>
      <div class="sub">CALENDAR &amp; DIARY</div>
    </div>
    <div class="photos">${pols}</div>
    <div class="info"><b>${CONTACT.account}</b><br>${CONTACT.mail}</div>
  </section>`;
}

function yearPage() {
  let g = "";
  for (let m = 1; m <= 12; m++)
    g += `<div class="ym" style="--ac:${ACCENTS[m - 1]}"><div class="mt">${m}월<span>${EN[m - 1]}</span></div>${miniGrid(YEAR, m, { holidays: true })}</div>`;
  return `
  <section class="page">
    <div class="hole"></div>
    <div class="year">
      <div class="y-left">
        <div class="y-head"><b>${YEAR}</b><span>한눈에 보는 한 해</span></div>
        <div class="ygrid">${g}</div>
      </div>
      <div class="y-right">
        ${brand()}
        <div class="y-box g"><div class="box-title">${YEAR} 나의 다짐 <small>RESOLUTION</small></div>${lines(6)}</div>
        <div class="y-box d"><div class="box-title">꼭 기억할 날 <small>SPECIAL DAYS</small></div>${checks(7)}</div>
      </div>
    </div>
  </section>`;
}

let html = `<div class="sheet-label">표지 · 앞면</div>${cover()}<div class="sheet-label">표지 · 뒷면 (연간 달력)</div>${yearPage()}`;
for (let m = 1; m <= 12; m++) {
  html += `<div class="sheet-label">${m}월 · 앞면 (달력 · 할 일 · 메모)</div>${front(m)}`;
  html += `<div class="sheet-label">${m}월 · 뒷면 (좋은 글 · 4대 사업)</div>${back(m)}`;
}
document.getElementById("root").innerHTML = html;
</script>
</body>
</html>
