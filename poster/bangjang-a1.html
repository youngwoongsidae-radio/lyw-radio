<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>전국 방장회의 안내 · 영웅시대</title>
<style>
/* A1 세로 (594 × 841 mm) 인쇄용 — 1쪽 안내 포스터, 2쪽 타임테이블 */
@page{size:594mm 841mm;margin:0}
:root{
  --bg1:#13294d;--bg2:#0a1630;--card:rgba(255,255,255,.055);--cardline:rgba(255,255,255,.13);
  --sky:#5ccbf5;--yellow:#ffc94a;--text:#fff;--muted:#a9b7cf;--rowline:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#555}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif,"Noto Color Emoji";color:var(--text);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all}
.page{width:594mm;height:841mm;overflow:hidden;position:relative;padding:44mm 46mm 0;
  background:radial-gradient(160mm 160mm at 88% 4%,rgba(92,203,245,.16),transparent 70%),
             linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 62%);
  page-break-after:always;break-after:page;margin:0 auto}
.page::before,.page::after{content:"";position:absolute;border-radius:50%;border:.9mm solid rgba(92,203,245,.2);pointer-events:none}
.page::before{width:330mm;height:330mm;right:-150mm;top:-120mm}
.page::after{width:250mm;height:250mm;right:-140mm;top:-70mm;border-color:rgba(92,203,245,.13)}
@media screen{.page{margin:20mm auto;box-shadow:0 4mm 16mm rgba(0,0,0,.4)}}

.badge{display:inline-block;background:var(--sky);color:#0a1630;font-size:15mm;font-weight:800;
  letter-spacing:1.4mm;padding:4.5mm 13mm;border-radius:20mm}
h1{font-weight:900;letter-spacing:-2.5mm;line-height:1.08}
h1 .sky{color:var(--sky)}
.lead{font-size:18mm;font-weight:500;color:#dbe4f3;margin-top:12mm}
.card{background:var(--card);border:.6mm solid var(--cardline);border-radius:9mm}
.note{font-size:11.5mm;color:var(--muted)}
.foot{position:absolute;left:46mm;right:46mm;bottom:40mm;display:flex;justify-content:space-between;align-items:flex-end}
.brand{font-size:24mm;font-weight:900;letter-spacing:-.5mm}

/* ── 1쪽 ── */
.p1 h1{font-size:86mm;margin-top:12mm}
.info{display:grid;grid-template-columns:1fr 1fr;gap:9mm;margin-top:22mm}
.info .card{padding:11mm 14mm 12mm}
.info .k{font-size:13mm;font-weight:800;color:var(--sky)}
.info .v{font-size:22mm;font-weight:800;margin-top:4mm;letter-spacing:-.4mm}
.info .s{font-size:13mm;color:var(--muted);margin-top:3mm}
.sec{font-size:17mm;font-weight:800;margin-top:20mm;display:flex;align-items:center;gap:8mm}
.sec::after{content:"";flex:1;height:.5mm;background:var(--cardline)}
.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:9mm;margin-top:12mm}
.agenda .card{padding:11mm 13mm 12mm;background:linear-gradient(160deg,rgba(92,203,245,.14),rgba(92,203,245,.04))}
.agenda .n{font-size:26mm;font-weight:900;color:var(--sky);line-height:1}
.agenda .t{font-size:17mm;font-weight:800;line-height:1.3;margin-top:5mm}
.agenda .w{font-size:11.5mm;color:var(--muted);margin-top:4mm}
.ask{margin-top:12mm;padding:11mm 16mm;border:.7mm dashed rgba(255,201,74,.55);border-radius:9mm;background:rgba(255,201,74,.08)}
.ask b{display:block;font-size:16mm;font-weight:800;color:var(--yellow)}
.ask p{font-size:14mm;line-height:1.45;margin-top:4mm;color:#e7edf7}

/* ── 2쪽 ── */
.p2 h1{font-size:84mm;margin-top:14mm}
.p2 .lead{margin-top:10mm}
.days{display:grid;grid-template-columns:1.5fr 1fr;gap:9mm;margin-top:22mm;align-items:start}
.day{padding:13mm 13mm 8mm}
.day h2{font-size:20mm;font-weight:900;display:flex;align-items:center;gap:5mm;margin-bottom:5mm}
.day h2 span{font-size:11mm;font-weight:800;background:var(--yellow);color:#1b1500;padding:2mm 6mm;border-radius:10mm}
.r{display:grid;grid-template-columns:52mm 1fr;gap:4mm;padding:8.8mm 0;border-top:.45mm solid var(--rowline);align-items:baseline}
.r:first-of-type{border-top:0}
.r .tm{font-size:14.5mm;font-weight:800;color:var(--sky);font-variant-numeric:tabular-nums}
.r .ds{font-size:14mm;font-weight:500;line-height:1.38}
.r.hl .tm,.r.hl .ds{color:var(--yellow);font-weight:800}
.day .ask{margin:10mm 0 6mm;padding:11mm 12mm}
.day .ask b{font-size:14mm}
.day .ask p{font-size:12.5mm}
</style>
</head><body>

<!-- ══════════════════════════════════════════════════════════════
     ① 여기만 고치면 됩니다
     ══════════════════════════════════════════════════════════════ -->
<script>
const INFO = {
  badge: "2026 · 3/4분기",
  lead:  "방장님들, 안녕하세요! 1박 2일로 함께 모여요 😊",
  cards: [
    ["🗓️ 일시",      "10.31(토) ~ 11.1(일)", "1박 2일"],
    ["⏰ 집결",      "10.31(토) 오전 11:30", "이천 임금님쌀밥집"],
    ["🍚 점심",      "임금님쌀밥집",         "이천 경충대로 3134"],
    ["🏨 회의 · 숙박", "여주 썬밸리호텔",      "대상 : 전국 방장님"],
  ],
  agenda: [
    ["01", "전국<br>응원 방향",        "1일차 15:30"],
    ["02", "총공 화력<br>응원 방향",   "1일차 15:30"],
    ["03", "응원 서포트<br>& 기타",    "1일차 19:30"],
  ],
  askTitle: "💡 방장님께 부탁드려요",
  ask:   "안건 1·2·3에 대한 우리 방의 의견과 아이디어를 미리 모아 와 주세요!",
  note:  "※ 타임테이블은 가안이며 변동될 수 있습니다.",
  where: "10.31(토) ~ 11.1(일) · 여주 썬밸리호텔",
};

// hl: true 면 노란색 강조 (안건 시간)
const DAYS = [
  { name:"1일차", date:"10.31 토", rows:[
    ["11:30", "집결 · 점심 식사 (이천 임금님쌀밥집)"],
    ["13:00", "카페 이동 · 뉴욕 타임스퀘어 결산보고 ☕"],
    ["14:30", "호텔 이동"],
    ["15:00", "체크인 · 회의 준비"],
    ["15:30", "안건 1 · 전국 응원 방향<br>안건 2 · 총공 화력 응원 방향", true],
    ["17:10", "Tea break"],
    ["17:20", "선물 나눔 · 행운권 추첨 🎁"],
    ["18:00", "저녁 식사 (호텔 11층)"],
    ["19:30", "안건 3 · 응원 서포트 관련 & 기타", true],
    ["21:00", "팀 레크리에이션 🎉"],
    ["22:00~", "취침 및 자율 시간"],
  ]},
  { name:"2일차", date:"11.1 일", rows:[
    ["07:00", "스파 & 휴식 ♨️ (희망자)"],
    ["08:30", "조식"],
    ["10:00", "체크아웃"],
    ["10:30", "신륵사 산책 🍂"],
    ["12:00", "여주아울렛 이동 🛍️"],
    ["13:00", "점심 식사"],
    ["14:00~", "자율 시간 · 귀가"],
  ], ask:true },
];
</script>

<section class="page p1">
  <span class="badge" id="badge1"></span>
  <h1>전국<br><span class="sky">방장회의</span> 안내</h1>
  <p class="lead" id="lead"></p>
  <div class="info" id="cards"></div>
  <div class="sec">회의 안건</div>
  <div class="agenda" id="agenda"></div>
  <div class="ask" id="ask1"></div>
  <div class="foot"><p class="note" id="note1"></p><div class="brand">영웅시대</div></div>
</section>

<section class="page p2">
  <span class="badge" id="badge2"></span>
  <h1><span class="sky">타임</span>테이블</h1>
  <p class="lead" id="where"></p>
  <div class="days" id="days"></div>
  <div class="foot"><p class="note" id="note2"></p><div class="brand">영웅시대</div></div>
</section>

<script>
const $ = id => document.getElementById(id);
const askHTML = `<b>${INFO.askTitle}</b><p>${INFO.ask}</p>`;
$("badge1").textContent = $("badge2").textContent = INFO.badge;
$("lead").textContent = INFO.lead;
$("where").textContent = INFO.where;
$("note1").textContent = $("note2").textContent = INFO.note;
$("ask1").innerHTML = askHTML;
$("cards").innerHTML = INFO.cards.map(([k, v, s]) =>
  `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
$("agenda").innerHTML = INFO.agenda.map(([n, t, w]) =>
  `<div class="card"><div class="n">${n}</div><div class="t">${t}</div><div class="w">${w}</div></div>`).join("");
$("days").innerHTML = DAYS.map(d => `
  <div class="card day">
    <h2>${d.name}<span>${d.date}</span></h2>
    ${d.rows.map(([tm, ds, hl]) => `<div class="r${hl ? " hl" : ""}"><div class="tm">${tm}</div><div class="ds">${ds}</div></div>`).join("")}
    ${d.ask ? `<div class="ask">${askHTML}</div>` : ""}
  </div>`).join("");
</script>
</body></html>
