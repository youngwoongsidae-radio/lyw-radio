<style>
  :root{
    --navy:#0C2340;
    --card:#143355;
    --line:#2A4A6E;
    --ivory:#F2EDE2;
    --dim:#A9BACD;
    --gold:#C9A227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--navy);
    background-image:radial-gradient(120% 60% at 50% 0%, #17406B 0%, #0C2340 60%);
    background-attachment:fixed;
    color:var(--ivory);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background-image:var(--bg-photo,none);
    background-size:cover;background-position:50% 12%;background-repeat:no-repeat;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,
      rgba(12,35,64,.62) 0%,
      rgba(12,35,64,.84) 38%,
      rgba(12,35,64,.94) 70%,
      rgba(12,35,64,.97) 100%);
  }
  .wrap{position:relative;max-width:640px;margin:0 auto;padding:0 18px 60px}
  a{text-decoration:none}
  a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  /* 사진 — 맨 위 큰 사진, 그리고 카드 사이사이 */
  .hero{
    width:100%;display:block;aspect-ratio:16/9;object-fit:cover;
    object-position:60% 42%;border-radius:14px;margin-top:18px;
    background:var(--line);
  }
  .band{
    width:100%;display:block;aspect-ratio:16/9;object-fit:cover;
    border-radius:14px;margin:16px 0;background:var(--line);
  }

  header{padding:26px 0 30px;text-align:center}
  h1{
    font-family:"Gowun Batang",serif;font-weight:700;
    font-size:clamp(27px,7.6vw,38px);line-height:1.3;letter-spacing:-.01em;
  }
  .rule{width:44px;height:2px;background:var(--gold);margin:16px auto 14px;border-radius:2px}
  .lede{color:var(--dim);font-size:16px}

  /* 글로벌 카드 */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px 20px;margin-bottom:14px;
  }
  .card h3{
    font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;letter-spacing:.02em;
  }
  .card .sub{color:var(--dim);font-size:15px;margin-top:4px}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:17px}
  .btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60px;padding:9px 16px;
    border-radius:11px;font-size:18px;font-weight:700;color:#0B1E33;
    text-align:center;line-height:1.32;
  }
  .btn .meta{
    display:block;margin-top:2px;
    font-size:14.5px;font-weight:600;opacity:.72;letter-spacing:.01em;
  }
  @media (hover:hover){.btn:hover{filter:brightness(1.08)}}

  /* 구역 제목 */
  .section-head{margin:34px 0 14px}
  .section-head h2{
    font-family:"Gowun Batang",serif;font-weight:700;font-size:22px;
  }
  .section-head p{color:var(--dim);font-size:15px;margin-top:3px}

  /* 국내 음원 */
  .svc{
    border-top:1px solid var(--line);
    padding:16px 2px 4px;
  }
  .svc:first-child{border-top:0;padding-top:4px}
  .svc-name{
    display:flex;align-items:center;gap:9px;
    font-family:"Gowun Batang",serif;font-weight:700;font-size:19px;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .svc-note{color:var(--dim);font-size:14.5px;margin-top:5px;line-height:1.5}
  .pills{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px;
  }
  .pill{
    display:flex;align-items:center;justify-content:center;
    min-height:50px;padding:8px 12px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ivory);
    font-size:16px;font-weight:600;
  }
  .pill.wide{grid-column:1 / -1}
  @media (hover:hover){.pill:hover{border-color:var(--gold)}}

  footer{
    margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--dim);font-size:14.5px;line-height:1.8;
  }
  footer p+p{margin-top:7px}

  .reveal{opacity:0;transform:translateY(9px)}
  .shown{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none}.shown{transition:none}
  }
</style>
</head>

(function(){
  document.querySelectorAll('[data-photo]').forEach(function(el){
    var n = parseInt(el.getAttribute('data-photo'),10);
    if(PHOTOS[n-1]) el.src = PHOTOS[n-1];
  });
  var n = (typeof BG_NUMBER === 'number') ? BG_NUMBER : 0;
  if(n >= 1 && n <= PHOTOS.length){
    document.documentElement.style.setProperty('--bg-photo','url("'+PHOTOS[n-1]+'")');
  }

<script>
(function(){
  var board = document.getElementById('board');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function has(v){ return (v || '').trim() !== ''; }

  /* 사진을 어디에 끼울지 — 카드 순서(0부터) : 사진 번호 */
  var GLOBAL_PHOTO   = { 0: 2, 2: 3 };   /* 스포티파이 뒤 2번, 유튜브뮤직 뒤 3번 */
  var DOMESTIC_PHOTO = { 1: 4, 3: 5 };   /* 지니 뒤 4번, 바이브 뒤 5번 */

  function band(n, parent){
    if(!window.PHOTOS || !PHOTOS[n-1]) return;
    var im = document.createElement('img');
    im.className = 'band reveal';
    im.alt = '';
    im.src = PHOTOS[n-1];
    parent.appendChild(im);
  }

  /* ---- 글로벌 ---- */
  var gi = -1;
  (window.GLOBAL || []).forEach(function(svc){
    var live = (svc.links || []).filter(function(l){ return has(l.url); });
    if(!live.length) return;

    var btns = live.map(function(l){
      var bits = [];
      if(has(l.songs)) bits.push(esc(l.songs.trim()));
      if(has(l.time))  bits.push(esc(l.time.trim()));
      var meta = bits.length ? '<span class="meta">' + bits.join(' · ') + '</span>' : '';
      return '<a class="btn" style="background:' + esc(svc.color) + ';color:' + esc(svc.ink || '#fff') +
             '" href="' + esc(l.url.trim()) + '" target="_blank" rel="noopener">' +
             '<span>' + esc(l.label) + '</span>' + meta + '</a>';
    }).join('');

    var card = document.createElement('section');
    card.className = 'card reveal';
    card.innerHTML =
      '<h3>' + esc(svc.name) + '</h3>' +
      (has(svc.note) ? '<p class="sub">' + esc(svc.note) + '</p>' : '') +
      '<div class="btns">' + btns + '</div>';
    board.appendChild(card);
    gi++;
    if(GLOBAL_PHOTO[gi]) band(GLOBAL_PHOTO[gi], board);
  });

  /* ---- 국내 음원 ---- */
  var dom = document.getElementById('domestic');
  var domWrap = document.getElementById('domestic-wrap');
  var shown = 0;

  (window.DOMESTIC || []).forEach(function(svc){
    var live = (svc.links || []).filter(function(l){ return has(l.url); });
    if(!live.length) return;
    shown++;

    var pills = live.map(function(l){
      var wide = live.length === 1 ? ' wide' : '';
      return '<a class="pill' + wide + '" href="' + esc(l.url.trim()) +
             '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
    }).join('');

    var block = document.createElement('div');
    block.className = 'svc reveal';
    block.innerHTML =
      '<div class="svc-name"><span class="dot" style="background:' +
        esc(svc.color || '#C9A227') + '"></span>' + esc(svc.name) + '</div>' +
      (has(svc.note) ? '<p class="svc-note">' + esc(svc.note) + '</p>' : '') +
      '<div class="pills">' + pills + '</div>';
    dom.appendChild(block);
    if(DOMESTIC_PHOTO[shown-1]) band(DOMESTIC_PHOTO[shown-1], dom);
  });

  if(shown) domWrap.hidden = false;

  /* ---- 등장 ---- */
  requestAnimationFrame(function(){
    document.querySelectorAll('.reveal').forEach(function(el, i){
      setTimeout(function(){ el.classList.add('shown'); }, 60 * i);
    });
  });
})();
</script>
